 <!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Video Chat - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .login-container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #4a148c;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #764ba2;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            color: white;
        }

        button:active {
            transform: scale(0.98);
        }

        #textChatBtn {
            background-color: #00b0ff;
        }

        #textChatBtn:hover {
            background-color: #0091ea;
        }

        #videoChatBtn {
            background-color: #00e676;
        }

        #videoChatBtn:hover {
            background-color: #00c853;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Premium Chat 🚀</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" placeholder="तुमचे नाव टाका..." required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="gender">तुमचे जेंडर (Your Gender):</label>
                <select id="gender">
                    <option value="male">पुरुष (Male)</option>
                    <option value="female">स्त्री (Female)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="matchFilter">तुम्हाला कोणासोबत जोडायचे? (Match Partner):</label>
                <select id="matchFilter">
                    <option value="all">सर्व (Everyone)</option>
                    <option value="male">फक्त पुरुष (Male Only)</option>
                    <option value="female">फक्त स्त्रिया (Female Only)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="location">लोकेशन (Location):</label>
                <select id="location">
                    <option value="Global">Global (पूर्ण जग)</option>
                    <option value="India">India (भारत)</option>
                    <option value="Maharashtra">Maharashtra (महाराष्ट्र)</option>
                </select>
            </div>

            <div class="btn-container">
                <button type="button" id="textChatBtn">Text Chat 💬</button>
                <button type="button" id="videoChatBtn">Video Chat 📹</button>
            </div>
        </form>
    </div>

    <script>
        // बटनांचे क्लिक इव्हेंट्स (पेज रिफ्रेश रोखण्यासाठी e.preventDefault() वापरले आहे)
        document.getElementById('textChatBtn').addEventListener('click', (e) => {
            e.preventDefault(); 
            handleLogin('text');
        });

        document.getElementById('videoChatBtn').addEventListener('click', (e) => {
            e.preventDefault(); 
            handleLogin('video');
        });

        function handleLogin(mode) {
            const username = document.getElementById('username').value.trim();
            const gender = document.getElementById('gender').value;
            const matchFilter = document.getElementById('matchFilter').value;
            const location = document.getElementById('location').value;

            if (!username) {
                alert("कृपया तुमचे नाव (Username) टाईप करा!");
                return;
            }

            // युजरचा डेटा एका ऑब्जेक्टमध्ये गोळा करणे
            const userData = {
                username: username,
                gender: gender,
                matchFilter: matchFilter,
                location: location,
                chatMode: mode
            };

            // हा डेटा तात्पुरता ब्राउझरच्या स्टोरेजमध्ये सेव्ह करणे
            sessionStorage.setItem('chatUser', JSON.stringify(userData));

            // मुख्य चॅटिंग पेजवर युजरला पाठवणे
            window.location.href = '/index.html'; 
        }
    </script>
</body>
</html>
